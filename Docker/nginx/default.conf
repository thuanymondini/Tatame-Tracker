server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # Cache DNS longo (era 10s — re-resolvia a cada requisição)
    resolver 127.0.0.11 valid=300s ipv6=off;

    # Gzip para respostas menores e mais rápidas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Cache de arquivos estáticos no browser
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream php:9000;
        fastcgi_pass $upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Buffer de resposta do PHP — evita manter conexão aberta esperando o cliente
        fastcgi_buffering on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Timeouts mais curtos = falha rápida em vez de travar
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;
    }

    location ~ /\. {
        deny all;
    }
}