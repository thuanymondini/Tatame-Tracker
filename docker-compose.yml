services:
  nginx:
    build:
      context: ./Docker/nginx
      dockerfile: Dockerfile.dev
    ports:
      - "80:80"
    volumes:
      - ./api:/var/www/html
      - ./Docker/nginx/default.conf.dev:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - node
    networks:
      - app-network

  node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - app-network

  php:
    build:
      context: ./api
      dockerfile: ../Docker/php/Dockerfile
    volumes:
      - ./api:/var/www/html
      - vendor:/var/www/html/vendor
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tatametrack
      MYSQL_USER: appuser
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"     # opcional: expõe para ferramentas como TablePlus/DBeaver
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  db-data:
  vendor:
  node_modules:

networks:
  app-network:
    driver: bridge